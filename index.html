<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix - Watch TV Shows Online, Watch Movies Online</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="banner-div">
        <button class="banner"><img src="/assets/images/gift.svg" alt="">
            <p>New to Netflix? Try 7 days for Rs&nbsp;0.</p>
        </button>
    </div>

    <div class="main">
        <nav>
            <span><img width="154" src="assets/images/logo.svg" alt="logo-image"></span>
            <div class="buttons">
                <select name="lang" id="lang">
                    <option value="eng">English</option>
                    <option value="ur">اردو</option>
                </select>
                <button class="sign-in">Sign In</button>
            </div>
        </nav>
        <div class="text">
            <h1 class="heading">Unlimited movies, TV </h1>
            <h1 class="heading"> shows, and more</h1>
            <p class="p1">Plans start at Rs 250. Cancel anytime.</p>
            <p class="p2">Ready to watch? Enter your email to start your membership.</p>
            <div class="email">
                <input type="email" name="email" placeholder="Email address" required>
                <button>Try 7 Day for Rs 0 <img src="/assets/images/arrow.svg" alt=""></button>
            </div>
            <p class="p2 p3">New memebers only. Terms below.</p>
        </div>
    </div>
    <div class="svg-banner">

    </div>
    <div class="movie-suggestion">
        <h2 class="heading-2">Trending Now</h2>
        <div class="card-row">
            <div class="card">
                <img src="/assets/images/Lock Upp.jpg"
                    alt="">
                <h1 class="number">1</h1>
            </div>
            <div class="card">
                <img src="/assets/images/Bhoot Bangla.jpg" alt="">
                <h1 class="number">2</h1>
            </div>
            <div class="card">
                <img src="/assets/images/Musafir Cafe.jpg" alt="">
                <h1 class="number">3</h1>
            </div>
            <div class="card">
                <img src="/assets/images/IKKA.jpg" alt="">
                <h1 class="number">4</h1>
            </div>
            <div class="card">
                <img src="/assets/images/Avatar The Last Airbender.jpg" alt="">
                <h1 class="number">5</h1>
            </div>
            <div class="card">
                <img src="/assets/images/Money Heist.jpg" alt="">
                <h1 class="number">6</h1>
            </div>
        </div>
    </div>
    <div class="description">
        <h2 class="heading-2">More Reasons to Join</h2>
    </div>
</body>

</html>
