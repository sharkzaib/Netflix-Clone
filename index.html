<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix - Watch TV Shows Online, Watch Movies Online</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="ban">
        <button class="banner"><img src="/assets/images/gift.svg" alt="">New to Netflix? Try 7 days for Rs&nbsp;0.</button>
    </div>
    
    <div class="main">
        <nav>
            <span><img width="154" src="assets/images/logo.svg" alt="logo-image"></span>
            <div class="buttons">
                <select name="lang" id="lang">
                    <option value="eng">English</option>
                    <option value="ur">اردو</option>
                </select>
                <button>Sign In</button>
            </div>
        </nav>
        <div class="box">
        </div>
        <div class="text">
            <h1 class="heading">Unlimited movies, TV </h1>
            <h1 class="heading"> shows, and more</h1>
            <span> Plans start at Rs 250. Cancel anytime.</span>
            <span> Ready to watch? Enter your email to start your membership.</span>
            <div class="email">
                <input type="email" name="email" id="email">
                <button>Try 7 Day for Rs 0</button>
            </div>

            <span>New memebers only. Terms below.</span>
        </div>
    </div>
</body>

</html>
